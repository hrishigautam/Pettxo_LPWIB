<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Page Not Found — Pettxo</title>

  <meta
    name="description"
    content="The page you're looking for could not be found on Pettxo."
  />

  <link rel="icon" type="image/png" href="/favicon.svg" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #F5EFE6;
      color: #5c3629;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .logo {
      width: 110px;
      height: auto;
      margin-bottom: 28px;
    }

    .code {
      margin: 0 0 8px;
      color: #F75927;
      font-size: 72px;
      line-height: 1;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 34px;
      line-height: 1.2;
    }

    p {
      margin: 0 auto 28px;
      max-width: 500px;
      color: #6b625d;
      font-size: 16px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: #F75927;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .logo {
        width: 90px;
        margin-bottom: 22px;
      }

      .code {
        font-size: 58px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <img
      src="/images/logo.png"
      alt="Pettxo"
      class="logo"
    />

    <div class="code">404</div>

    <h1>Oops! Page not found.</h1>

    <p>
      The page you're looking for doesn't exist or may have been moved.
      Let's get you back to Pettxo.
    </p>

    <a href="/" class="button">
      Back to Home
    </a>
  </main>
</body>
</html>
